name: Build

# CI pro master a PR do masteru - jen ověření, že se to sestaví a projdou testy.
# Container image i nasazení dělá deploy.yml, spouštěný výhradně ručně.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore VolejbalApp.slnx

      - name: Build
        run: dotnet build VolejbalApp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Tests/Tests.csproj --no-build --configuration Release --verbosity normal
