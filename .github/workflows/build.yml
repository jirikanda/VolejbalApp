name: Build

# CI pro master a PR do masteru - jen ověření, že se to sestaví a projdou testy.
# Publish a nasazení (Api, frontend, infrastruktura) dělá deploy.yml, spouštěný výhradně ručně.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

# Přebitý běh PR (nový push do téže větve) se zruší; běhy na masteru se nikdy neruší,
# aby každý commit v masteru měl svůj výsledek.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x

      # Experiment: NuGet cache vypnutá. Cache má ~503 MB a její obnovení stojí ~6 s (+ ~4 s uložení při
      # změně balíčků), restore s ní přesto trvá ~15 s. Pokud restore bez cache nebude výrazně pomalejší
      # než ~25 s, smazat natrvalo; jinak odkomentovat.
      # - name: Cache NuGet packages
      #   uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      #   with:
      #     path: ~/.nuget/packages
      #     key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
      #     restore-keys: |
      #       ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore VolejbalApp.slnx

      # Restore na úrovni solution nespustí restore hook Azure.Functions.Sdk, který generuje a obnovuje
      # pomocný projekt s Functions extensions. Bez tohoto kroku build hlásí AZFW0108 a dělá
      # restore-during-build ("may cause issues in some build environments").
      - name: Restore Functions extensions
        run: dotnet restore src/Api/Api.csproj

      - name: Build
        run: dotnet build VolejbalApp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Tests/Tests.csproj --no-build --configuration Release --verbosity normal
