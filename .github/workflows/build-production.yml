name: Build Production

# CI pro produkční branch - kromě build+test publikuje MigrationTool jako artefakt
# a Web jako container image do ghcr.io. Záměrně bez pull_request triggeru.
on:
  push:
    branches: [ "release/production" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push container image do ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore VolejbalApp.slnx

      - name: Build
        run: dotnet build VolejbalApp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Tests/Tests.csproj --no-build --configuration Release --verbosity normal

      # ReadyToRun se aktivuje v csproj podle RID - globální -p:PublishReadyToRun by rozbilo Web.Client (browser-wasm).
      # RID-specific restore si dělá publish krok sám (bez --no-restore) - restore celé solution s --runtime
      # by u Web.Client (browser-wasm) vyžadoval neexistující Mono runtime pack pro linux-x64.
      - name: Publish MigrationTool
        run: dotnet publish MigrationTool/MigrationTool.csproj --configuration Release --runtime linux-x64 --self-contained false --output ./publish/MigrationTool

      - name: Upload MigrationTool artifact
        uses: actions/upload-artifact@v4
        with:
          name: MigrationTool
          path: ./publish/MigrationTool

      # Container image pro Web (nasazuje se na Azure Container Apps, viz deploy/main.bicep) - přes vestavěnou
      # kontejnerizaci .NET SDK, žádný Dockerfile. GITHUB_TOKEN stačí (packages: write výše), žádný extra secret netřeba.
      #
      # Tag je jen commit SHA, záměrně žádný "latest" - tenhle workflow jen publikuje image, nic nedeployuje.
      # Nasazení (CD) je oddělený ruční krok (viz .github/workflows/deploy.yml), který explicitně vybírá SHA -
      # floating "latest" tag by byl implicitní deploy target bez záměrného rozhodnutí, co jde do produkce.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute container image repository name
        id: image
        run: echo "repository=${GITHUB_REPOSITORY_OWNER,,}/volejbal-web" >> "$GITHUB_OUTPUT"

      # Bez --no-restore ze stejného důvodu jako "Publish MigrationTool" výše (RID-specific restore).
      - name: Build and push Web container image
        run: |
          dotnet publish Web/Web.csproj --configuration Release --os linux --arch x64 \
            -t:PublishContainer \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository=${{ steps.image.outputs.repository }} \
            -p:ContainerImageTag=${{ github.sha }}
