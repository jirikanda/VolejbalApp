name: Deploy to Azure

# Záměrně jen ruční spuštění, očekává se nad master. Jeden workflow dělá celou cestu:
# build + test (totéž co CI v build.yml), nasazení bicep šablony a nahrání balíčků API i frontendu.
#
# Nasazuje se vždy právě odbavený commit - proto tu není žádný input s verzí: co je v branchi, to se
# nasadí. Ruční spuštění je samo o sobě to rozhodnutí, co jde do produkce.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore VolejbalApp.slnx

      # Restore na úrovni solution nespustí restore hook Azure.Functions.Sdk, který generuje a obnovuje
      # pomocný projekt s Functions extensions. Bez tohoto kroku build hlásí AZFW0108 a dělá
      # restore-during-build ("may cause issues in some build environments").
      - name: Restore Functions extensions
        run: dotnet restore src/Api/Api.csproj

      - name: Build
        run: dotnet build VolejbalApp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Tests/Tests.csproj --no-build --configuration Release --verbosity normal

      # MigrationTool se tu ZÁMĚRNĚ nepublikuje ani nespouští - migrace schématu se pouští ručně
      # z lokálního repa (dotnet run --project MigrationTool), a to PŘED spuštěním tohoto
      # workflow, pokud přibyla migrace. Viz infra/README.md.

      # Bez --no-restore: tenhle krok si dělá vlastní RID-specific restore kvůli ReadyToRun, který se
      # v csproj aktivuje podle RID. Restore celé solution s --runtime nejde - u Web.Client
      # (browser-wasm) by vyžadoval neexistující Mono runtime pack pro linux-x64. Globální
      # -p:PublishReadyToRun na CLI by protekl do Web.Client a spadl na NETSDK1095.
      - name: Publish Api
        run: |
          dotnet publish src/Api/Api.csproj --configuration Release \
            --runtime linux-x64 --self-contained false \
            --output ./publish/Api

      # Flex Consumption nasazuje zip do blob containeru, ne container image. Zipuje se obsah
      # publish adresáře (host.json musí ležet v kořeni balíčku, ne v podadresáři).
      - name: Package Api
        run: |
          cd ./publish/Api
          zip -r ../../api.zip . > /dev/null

      - name: Upload Api package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-package
          path: api.zip
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # environment: Production drží pohromadě dvě věci: umožňuje přidat required reviewers
    # (Settings -> Environments), takže se pipeline zastaví až TĚSNĚ PŘED nasazením (build i testy
    # už jsou v tu chvíli hotové), a určuje subject federated credentialu v Entra ID
    # ("repo:jirikanda@5111719/VolejbalApp@169379851:environment:Production" - repozitář má zapnuté
    # immutable subject claims, proto ta ID). Odebrání tohoto řádku rozbije Azure login.
    environment: Production
    permissions:
      contents: read
      id-token: write # OIDC token pro azure/login (federated credentials - žádné heslo v secrets)
    env:
      RESOURCE_GROUP: JkVolejbalRG

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Api package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: api-package

      # Federated credentials (OIDC) - GitHub vydá krátkodobý token, Entra ID ho vymění za Azure token.
      # Žádné heslo/certifikát v secrets, není co rotovat.
      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Nasazuje se celá šablona, ne jen aplikace: ARM v incremental módu projde nezměněné resources
      # (Log Analytics, App Insights, storage) jako no-op, takže to stojí minutu navíc, ale
      # infrastruktura nemůže začít odpovídat něčemu jinému než šabloně.
      #
      # Pořadí je závazné: šablona musí Function App vytvořit (a přiřadit jí role ke storage) dřív,
      # než se do ní nahraje balíček.
      - name: Deploy Bicep template
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --name jk-volejbal \
            --parameters \
              databaseConnectionString='${{ secrets.DATABASE_CONNECTION_STRING }}'

      - name: Read Function App name
        id: functionapp
        run: |
          NAME=$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name jk-volejbal \
            --query properties.outputs.functionAppName.value -o tsv)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy Api package
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ steps.functionapp.outputs.name }}
          package: api.zip
          sku: flexconsumption

      - name: Show deployed URL
        run: |
          az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name jk-volejbal \
            --query properties.outputs.functionAppUrl.value \
            -o tsv

  # Samostatný job, ne rozšíření build/deploy: publish Web.Client je nezávislý na publishi API
  # (jiný dotnet publish, jiný artefakt) a build/deploy jsou rozdělené kvůli schvalování,
  # ne kvůli pohodlí - stejný důvod platí i tady, selhání frontendu se nemá tvářit jako selhání API.
  deploy-frontend:
    needs: deploy
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write # OIDC token pro azure/login (stejný federated credential jako deploy job - subject je vázaný na environment, ne na jméno jobu)
    env:
      RESOURCE_GROUP: JkVolejbalRG

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Web.Client
        run: dotnet publish src/Web.Client/Web.Client.csproj --configuration Release --output ./publish/Web.Client

      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Deployment token SWA zjišťujeme za běhu přes OIDC session, ne z uloženého GitHub secretu:
      # nahrávání obsahu do SWA sice OIDC cestu nemá a chce API klíč, ale ten klíč jde přečíst
      # přes stejné OIDC přihlášení jako bicep deploy (Contributor na resource group). Díky tomu
      # v repu nepřibývá žádné dlouhodobé tajemství k rotaci - token žije jen v rámci tohoto běhu.
      # ::add-mask:: ho schová v logu.
      - name: Get Static Web App deployment token
        id: swa-token
        run: |
          SWA_NAME=$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name jk-volejbal \
            --query properties.outputs.staticWebAppName.value -o tsv)
          TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # Vlastní dotnet publish + skip_app_build, ne Oryx build uvnitř akce - konzistentní
      # s tím, že repo dělá každý jiný publish krok explicitně, a nezávislé na tom, jak rychle Oryx
      # buildimage doběhne .NET 10 a jak se popere s central package managementem (Directory.Packages.props).
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ./publish/Web.Client/wwwroot
          skip_app_build: true

      - name: Show deployed URL
        run: |
          az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name jk-volejbal \
            --query properties.outputs.staticWebAppDefaultHostname.value \
            -o tsv
