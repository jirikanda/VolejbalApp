name: Deploy to Azure Container Apps

# Záměrně jen ruční spuštění - CI (build-production.yml) publikuje image na každý push do release/production,
# ale nasazení do produkce je oddělené a vyžaduje explicitní volbu, který commit SHA jde ven.
on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: "Commit SHA image (ghcr.io/<owner>/volejbal-web), který se má nasadit - viz běhy workflow Build Production"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC token pro azure/login (federated credentials - žádné heslo service principalu v secrets)

env:
  RESOURCE_GROUP: JkVolejbalRG

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # viz Settings -> Environments - sem lze přidat required reviewers jako schvalovací krok
    steps:
      - uses: actions/checkout@v4

      # Federated credentials (OIDC) - GitHub vydá krátkodobý token, Entra ID ho vymění za Azure token.
      # Žádné heslo/certifikát v secrets, není co rotovat. Federated credential v Entra ID musí mít
      # subject "repo:<owner>/<repo>:environment:production" - job níže běží pod environment: production,
      # a v tom případě je environment claim, ne branch/ref (viz deploy/README.md).
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compute image reference
        id: image
        run: echo "reference=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/volejbal-web:${{ inputs.imageTag }}" >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep template
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deploy/main.bicep \
            --name jk-volejbal \
            --parameters \
              containerImage='${{ steps.image.outputs.reference }}' \
              databaseConnectionString='${{ secrets.DATABASE_CONNECTION_STRING }}'

      - name: Show deployed URL
        run: |
          az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name jk-volejbal \
            --query properties.outputs.containerAppUrl.value \
            -o tsv
