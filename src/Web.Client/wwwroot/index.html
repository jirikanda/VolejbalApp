<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <base href="/" />
    <script>
        (function () {
            try {
                var t = localStorage.getItem('volejbal-theme');
                if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) { }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="css/volejbal.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
</head>

<body>
    <!-- Úvodní obrazovka, než se stáhne a nastartuje WASM. Používá stejné .topbar/.brand
         jako MainLayout, aby hlavička po naběhnutí aplikace nepřeskočila; celý blok Blazor
         při renderu kořenové komponenty do #app zahodí. -->
    <div id="app">
        <div class="app">
            <header class="topbar">
                <span class="brand">
                    <span class="mark loading" aria-hidden="true">
                        <svg class="ball" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <defs>
                                <linearGradient id="boot-ball-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#FAEFD8" />
                                    <stop offset="100%" stop-color="#C7A26B" />
                                </linearGradient>
                            </defs>
                            <circle cx="12" cy="12" r="10" fill="url(#boot-ball-bg)" stroke="#3D2817" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                            <g fill="none" stroke="#3D2817" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11.1 7.1a16.55 16.55 0 0 1 10.9 4" />
                                <path d="M12 12a12.6 12.6 0 0 1-8.7 5" />
                                <path d="M16.8 13.6a16.55 16.55 0 0 1-9 7.5" />
                                <path d="M20.7 17a12.8 12.8 0 0 0-8.7-5 13.3 13.3 0 0 1 0-10" />
                                <path d="M6.3 3.8a16.55 16.55 0 0 0 1.9 11.5" />
                            </g>
                        </svg>
                    </span>
                    <span class="name">Volejbal</span>
                </span>
            </header>

            <div class="boot" role="status" aria-live="polite">
                <div class="boot-track"><span class="boot-sweep"></span></div>
                <p class="boot-label">Načítání…</p>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
