<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <base href="/" />
    <script>
        (function () {
            try {
                var t = localStorage.getItem('volejbal-theme');
                if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) { }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="css/volejbal.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
</head>

<body>
    <!-- Úvodní obrazovka, než se stáhne a nastartuje WASM. Používá stejné .topbar/.brand
         jako MainLayout, aby hlavička po naběhnutí aplikace nepřeskočila; celý blok Blazor
         při renderu kořenové komponenty do #app zahodí. -->
    <div id="app">
        <div class="app">
            <header class="topbar">
                <span class="brand">
                    <span class="mark loading" aria-hidden="true">
                        <svg class="ball" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <defs>
                                <linearGradient id="boot-ball-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#FAEFD8" />
                                    <stop offset="100%" stop-color="#C7A26B" />
                                </linearGradient>
                            </defs>
                            <circle cx="12" cy="12" r="10" fill="url(#boot-ball-bg)" stroke="#3D2817" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                            <g fill="none" stroke="#3D2817" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11.1 7.1a16.55 16.55 0 0 1 10.9 4" />
                                <path d="M12 12a12.6 12.6 0 0 1-8.7 5" />
                                <path d="M16.8 13.6a16.55 16.55 0 0 1-9 7.5" />
                                <path d="M20.7 17a12.8 12.8 0 0 0-8.7-5 13.3 13.3 0 0 1 0-10" />
                                <path d="M6.3 3.8a16.55 16.55 0 0 0 1.9 11.5" />
                            </g>
                        </svg>
                    </span>
                    <span class="name">Volejbal</span>
                </span>
            </header>

            <div class="boot" role="status" aria-live="polite">
                <div class="boot-track"><span class="boot-sweep"></span></div>
                <p class="boot-label">Načítání…</p>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <!-- Start Blazoru s obsluhou selhání. Když runtime nenaběhne (typicky starší prohlížeč: .NET 11
         vyžaduje WASM výjimky s exnref, tj. Safari 18.4 / Chrome 137 / Firefox 131, viz
         dotnet/runtime#137477), zůstalo by navždy "Načítání…". Místo toho ukážeme chybu a verzi
         prohlížeče, aby ze screenshotu bylo poznat, o co jde. Schopnosti prohlížeče se předem
         nezjišťují - rozhoduje až skutečné selhání. Skript je schválně inline: kdyby se nenačetl
         ze samostatného souboru, neměl by chybu kdo ohlásit. -->
    <script>
        (function () {
            var started = false;

            function describe(reason) {
                if (!reason) {
                    return 'Neznámá chyba.';
                }
                if (reason.stack) {
                    // některé prohlížeče (Safari) ve stacku zprávu neopakují
                    return (reason.message && (reason.stack.indexOf(reason.message) < 0))
                        ? (reason.message + '\n' + reason.stack)
                        : reason.stack;
                }
                return String(reason.message || reason);
            }

            function element(tag, className, text) {
                var el = document.createElement(tag);
                if (className) {
                    el.className = className;
                }
                if (text) {
                    el.textContent = text;
                }
                return el;
            }

            function showBootError(reason) {
                // .boot existuje jen do prvního renderu Blazoru; jakmile aplikace běží, chyby řeší ona
                var boot = document.querySelector('#app .boot');
                if (started || !boot) {
                    return;
                }
                started = true;

                var page = element('div', 'error-page');
                page.setAttribute('role', 'alert');
                page.appendChild(element('h2', null, 'Ups...'));
                page.appendChild(element('p', 'error-lead', 'Aplikaci se nepodařilo spustit.'));
                page.appendChild(element('p', 'error-hint', 'Nejčastěji pomůže aktualizace prohlížeče nebo systému v zařízení.'));

                var restart = element('p');
                var link = element('a', null, 'Zkusit znovu');
                link.href = '/';
                restart.appendChild(link);
                page.appendChild(restart);

                var detail = element('div', 'error-detail');
                // prohlížeč první: výpis chyby bývá dlouhý a na snímku z telefonu by ho odsunul mimo obrazovku
                detail.appendChild(element('p', 'error-detail-label', 'Prohlížeč'));
                detail.appendChild(element('pre', null, navigator.userAgent));
                detail.appendChild(element('p', 'error-detail-label', 'Chyba'));
                detail.appendChild(element('pre', null, describe(reason)));
                page.appendChild(detail);

                boot.parentNode.replaceChild(page, boot);

                var mark = document.querySelector('#app .mark.loading');
                if (mark) {
                    mark.classList.remove('loading');
                }
            }

            function handleError(e) {
                // chyba skriptu, nebo skript, který se nepodařilo stáhnout (ne font či obrázek)
                if (e.error || e.message) {
                    showBootError(e.error || e.message);
                } else if (e.target && (e.target.tagName === 'SCRIPT')) {
                    showBootError('Nepodařilo se načíst ' + e.target.src);
                }
            }

            function handleRejection(e) {
                showBootError(e.reason);
            }

            window.addEventListener('error', handleError, true);
            window.addEventListener('unhandledrejection', handleRejection);

            try {
                Blazor.start().then(function () {
                    started = true;
                    window.removeEventListener('error', handleError, true);
                    window.removeEventListener('unhandledrejection', handleRejection);
                }, showBootError);
            } catch (e) {
                // Blazor není definován = blazor.webassembly.js se nenačetl nebo ho prohlížeč nezparsoval
                showBootError(e);
            }
        })();
    </script>
</body>

</html>
